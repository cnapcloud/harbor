# Configuration file of Harbor
# hostname: Docker 레지스트리에 접속할 IP 또는 도메인 (localhost/127.0.0.1 불가)
hostname: harbor.cnap.dev

# HTTP only (HTTPS 미사용)
http:
  port: 80

# https 비활성화 시 아래 블록 전체 주석 처리
# https:
#   port: 443
#   certificate: /your/certificate/path
#   private_key: /your/private/key/path

# 초기 admin 비밀번호 (최초 설치 시에만 적용, 이후 UI에서 변경)
harbor_admin_password: Harbor12345

# Harbor DB 설정
database:
  password: root123
  max_idle_conns: 100
  max_open_conns: 900
  conn_max_lifetime: 5m
  conn_max_idle_time: 0

# 데이터 저장 경로
data_volume: /Users/lemon/harbor-data

trivy:
  ignore_unfixed: false
  skip_update: false
  skip_java_db_update: false
  db_repository: ghcr.io/aquasecurity/trivy-db
  java_db_repository: ghcr.io/aquasecurity/trivy-java-db
  offline_scan: false
  security_check: vuln
  insecure: false
  timeout: 5m0s

jobservice:
  max_job_workers: 10
  max_job_duration_hours: 24
  job_loggers:
    - STD_OUTPUT
    - FILE
  logger_sweeper_duration: 1

notification:
  webhook_job_max_retry: 3
  webhook_job_http_client_timeout: 3

log:
  level: info
  local:
    rotate_count: 50
    rotate_size: 200M
    location: /var/log/harbor

#This attribute is for migrator to detect the version of the .cfg file, DO NOT MODIFY!
_version: 2.15.0

proxy:
  http_proxy:
  https_proxy:
  no_proxy:
  components:
    - core
    - jobservice
    - trivy

upload_purging:
  enabled: true
  age: 168h
  interval: 24h
  dryrun: false

cache:
  enabled: false
  expire_hours: 24
